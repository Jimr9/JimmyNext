# Local copy of Nexus's own crates/tempo-fast-sys/Cargo.toml, standalone rather than a workspace
# member (this lives outside the Nexus checkout) -- see build.rs's own header comment for why
# this copy exists at all. edition/license inlined from Nexus's own workspace.package (was
# edition.workspace = true / license.workspace = true); authors and [lints] workspace
# inheritance dropped -- not applicable to an unpublished, standalone internal build-helper copy.
[package]
publish = false
name = "tempo-fast-sys"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Raw FFI bindings to libtempo — the standalone FT1 4-CPM turbo modem (Fortran)"
links = "ft1"
build = "build.rs"

[lib]
