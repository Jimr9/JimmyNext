[package]
name = "jimmy-engine-host"
version = "0.2.0"
edition = "2021"

# Self-sufficiency plan Phase 5: jimmy-engine-host no longer hand-rolls its own decode/TX-
# scheduling/PTT loop. Nexus's own production radio loop -- tempo_audio::service::run_radio,
# driven against a real tempo_app::engine::Engine -- already does all of that, tested, in
# Nexus's own shipped desktop app: real audio capture/playback, wall-clock-UTC-steered slot
# timing (SlotClock, NTP-offset corrected), an async decode-worker thread, real PTT/CAT via a
# Rig it builds internally, and -- critically -- it already speaks the full standard WSJT-X UDP
# protocol both directions (RadioConfig.wsjtx_udp) when asked to. This crate's whole job is now
# just: build an Engine + RadioConfig from Jimmy's CLI args and call run_radio on a thread. See
# EngineHost/src/main.rs's own header comment for the full reasoning (this superseded an earlier,
# hand-rolled main.rs/audio.rs/tx_control.rs/tx_schedule.rs -- see git history, "TX wiring Stage
# 1-4" and the Phase 5 planning session -- once the operator asked whether jimmy-engine-host was
# reusing Nexus the right way, and it turned out to be re-deriving run_radio by hand).
#
# Nexus's crates are GPL-3.0; this crate inherits that for the same reason Nexus's own NOTICE
# documents (linking GPLv3-derived modem code).
#
# Path dependencies below point at EngineHost/.nexus-src -- NOT a developer's own Nexus clone.
# That directory is git-ignored, build-generated, and owned entirely by
# scripts/prepare-nexus.ps1: a clean checkout of official Nexus at the exact revision pinned in
# EngineHost/nexus-compat/pin.txt, with the small set of Jimmy-owned compatibility patches in
# EngineHost/nexus-compat/patches/ applied on top (see EngineHost/nexus-compat/README.md for
# what each one does and why). Run that script before building if EngineHost/.nexus-src doesn't
# exist yet. A developer's own reference clone of Nexus (e.g. C:\claude\nexus) is never modified
# -- the script only ever reads git objects from it (for a faster clone), never writes to it.
license = "GPL-3.0-only"

[[bin]]
name = "jimmy-engine-host"
path = "src/main.rs"

[dependencies]
# Engine: the real QSO/TX/decode orchestrator (FT8/FT4/WSPR/FST4/... all live here). Nexus's own
# desktop app drives this exact type the same way this crate now does.
tempo-app = { path = ".nexus-src/crates/tempo-app" }
# `device`: real sound-card I/O (cpal) -- also what gates on tempo-audio's `service` module
# (run_radio itself). `serial`: RTS/DTR PTT via the `serialport` crate -- Windows only needs
# this for serial enumeration/control, no libudev involved (that's the Linux-only concern the
# feature's own doc comment flags).
tempo-audio = { path = ".nexus-src/crates/tempo-audio", features = ["device", "serial"] }
tempo-core = { path = ".nexus-src/crates/tempo-core" }
# Direct-TCP control channel (Self-sufficiency plan Phase 6): serializes Engine::snapshot()'s
# AppSnapshot to JSON for Jimmy's own DirectEngineClient to poll over the control port, replacing
# the WSJT-X UDP heartbeat/negotiation handshake for that path entirely. AppSnapshot already
# derives Serialize/Deserialize (tempo-app/src/dto.rs) for Nexus's own Tauri IPC -- this reuses
# that, not a new serialization scheme. `derive` feature: this crate's own ReplyArgs struct
# (the REPLY command's inbound JSON shape) needs #[derive(Deserialize)] too.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Not needed by main.rs itself (Engine calls the native FT8 encoder/decoder internally) -- only
# by tests/{roundtrip,qso_sequencing}.rs, which regression-test the underlying DSP/QSO-sequencer
# primitives Engine now wraps, directly and independently of Engine itself. Sourced from the same
# prepared checkout as tempo-app/tempo-audio above -- see that comment.
ft8 = { path = ".nexus-src/crates/ft8" }
modes = { path = ".nexus-src/crates/modes" }
# tests/dxcc_shadow_dump.rs: dumps propagation::dxcc::resolve() for a fixed callsign list so
# it can be diffed against Jimmy's own ClubLogProvider (WSJTX_Controller/Lookup/) for the DXCC-
# source shadow comparison. Not used by main.rs -- investigative/comparison tooling only.
propagation = { path = ".nexus-src/crates/propagation" }

# This crate had no [profile.release] of its own -- silently relying on whatever the toolchain
# does by default instead of matching Nexus's own real, shipped configuration. Nexus's own root
# Cargo.toml and src-tauri/Cargo.toml both explicitly set exactly this (confirmed 2026-08-08,
# tracking down a real crash that a debug-symbols build of the identical source did NOT
# reproduce -- pointing at a build-profile mismatch, not a logic bug). Match Nexus's own
# verified-in-production setting exactly rather than guess at which flag matters.
[profile.release]
strip = "debuginfo"
