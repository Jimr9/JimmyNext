name: CI

# Practical safety net, not a replacement for JAWS/NVDA or real-radio testing (see
# ARCHITECTURE.md). Mirrors the exact manual build sequence used during development:
# prepare pinned+patched Nexus, build/test EngineHost, build/test Jimmy Test.
on:
  push:
    branches: [development/jimmy-next]
  pull_request:
    branches: [development/jimmy-next]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Provides gfortran/cmake/ninja/fftw for tempo-fast-sys's native libtempo build --
      # the same MSYS2 UCRT64 toolchain used for every local build in this repo.
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # A dedicated listing step across three failed runs confirmed pacman DOES install the
          # packages below (its own output says so), yet C:\msys64\ucrt64\bin -- the path every
          # local dev build on this repo uses -- did not exist afterward, and neither PATH nor
          # CC/CXX/FC pointed at it working. Guessing a different fixed path blind again isn't
          # worth another round trip: using the action's own `shell: msys2 {0}` wrapper for the
          # build/test steps below sidesteps needing to know the exact path at all. `inherit`
          # keeps the Windows PATH (rustup/cargo, preinstalled on this runner image) available
          # from inside that wrapper too, since cargo itself isn't one of the installed packages.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost

      - name: Prepare pinned + patched Nexus
        run: powershell -ExecutionPolicy Bypass -File scripts\prepare-nexus.ps1

      - name: Verify no developer-specific Nexus path leaked into the build config
        # Scoped to actual dependency path lines, not the whole file -- Cargo.toml's own
        # explanatory comments legitimately mention a developer checkout path as an example
        # of what NOT to depend on, which a whole-file match would misfire on.
        run: |
          if (Select-String -Path EngineHost\Cargo.toml -Pattern '^\s*\w[\w-]*\s*=\s*\{[^}]*path\s*=\s*"C:' -Quiet) {
            throw "EngineHost/Cargo.toml has a dependency path pointing at an absolute developer-specific location -- see EngineHost/nexus-compat/README.md"
          }

      # EngineHost/.cargo/config.toml pins the build target to x86_64-pc-windows-gnu explicitly
      # (tempo-fast-sys's native link step needs MinGW gfortran/fftw3f, which MSVC's link.exe
      # cannot resolve -- confirmed by a run that got all the way through compiling every crate
      # and failed only at the final link, LNK1181 "cannot open input file 'gfortran.lib'"). This
      # runner's default toolchain is MSVC-hosted, so the GNU target needs installing explicitly;
      # every local dev build on this repo never needed this because that machine's own rustup
      # default already happens to be GNU-hosted.
      - name: Add the GNU Rust target
        shell: msys2 {0}
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build EngineHost (release)
        shell: msys2 {0}
        run: |
          cd EngineHost
          cargo build --release

      - name: Test EngineHost
        shell: msys2 {0}
        run: |
          cd EngineHost
          cargo test --release

      - name: Fetch bundled Hamlib
        run: powershell -ExecutionPolicy Bypass -File fetch-hamlib.ps1

      # Same DLLs stage-runtime-dlls.ps1 stages locally (see that script's own comment for why
      # jimmy-engine-host.exe needs them next to itself), copied via bash/$MINGW_PREFIX instead
      # of that script directly: its own hardcoded C:\msys64\ucrt64 path is a real local-dev
      # convention this runner doesn't share (confirmed: the actual MSYS2 install location here
      # isn't fixed/guessable from a plain pwsh step), so build/test above already moved to the
      # action's own `shell: msys2 {0}` wrapper for the same reason. Reordered after the Hamlib
      # fetch above (unlike stage-runtime-dlls.ps1, which requires Hamlib already fetched but
      # doesn't fetch it itself) so the hamlib\ copy below has a real source to copy from.
      - name: Stage EngineHost runtime DLLs
        shell: msys2 {0}
        run: |
          DEST=EngineHost/target/x86_64-pc-windows-gnu/release
          cp "$MINGW_PREFIX"/bin/libgfortran-5.dll "$DEST"/
          cp "$MINGW_PREFIX"/bin/libstdc++-6.dll "$DEST"/
          cp "$MINGW_PREFIX"/bin/libfftw3f-3.dll "$DEST"/
          cp "$MINGW_PREFIX"/bin/libquadmath-0.dll "$DEST"/
          cp "$MINGW_PREFIX"/bin/libgcc_s_seh-1.dll "$DEST"/
          cp "$MINGW_PREFIX"/bin/libwinpthread-1.dll "$DEST"/
          mkdir -p "$DEST"/hamlib
          cp WSJTX_Controller/Resources/hamlib/* "$DEST"/hamlib/

      # Jimmy.csproj's own JimmyClubLogKeyCheck target fails any build fast if
      # $(ClubLogKeyFile) (default: a private path outside the repo, never source control) is
      # missing or empty -- correct behavior for a real dev/release build, but CI has and should
      # have no access to the real key (CLAUDE.md: never expose credentials in CI). A placeholder
      # satisfies the check without needing any real secret -- CI never makes live Club Log calls
      # (no test here does live network I/O), so a non-functional value is fine. Overridden via
      # the ClubLogKeyFile MSBuild property rather than writing to the real default path, so nothing
      # about a real local dev build changes.
      - name: Create placeholder Club Log key for CI
        run: |
          $lines = @("placeholder") * 8 + @("CI-PLACEHOLDER-NOT-A-REAL-KEY")
          $path = Join-Path $env:RUNNER_TEMP "clublog_key_placeholder.txt"
          Set-Content -Path $path -Value $lines
          echo "CLUBLOG_KEY_FILE=$path" >> $env:GITHUB_ENV

      - name: Build Jimmy Test (Debug, isolated identity)
        run: dotnet build "WSJTX_Controller\Jimmy.csproj" -c Debug -p:AssemblyName="Jimmy Test" -p:ClubLogKeyFile="$env:CLUBLOG_KEY_FILE" -v:minimal

      - name: Build JimmyTests
        run: dotnet build "JimmyTests\JimmyTests.csproj" -c Debug -v:minimal

      - name: Run JimmyTests
        run: '& "JimmyTests\bin\Debug\net10.0-windows\JimmyTests.exe"'

      - name: Publish self-contained Jimmy Test + build installer MSI
        run: |
          cd Setup_WiX
          dotnet publish ..\WSJTX_Controller\Jimmy.csproj -c Release -p:AssemblyName="Jimmy Test" -p:ClubLogKeyFile="$env:CLUBLOG_KEY_FILE" -p:SelfContained=true -r win-x64 -o PublishOutputTest
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.Firewall.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          wix build JimmyTest.wxs -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext -arch x64 -o JimmyTest.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: JimmyTest-msi
          path: Setup_WiX/JimmyTest.msi
          retention-days: 14
